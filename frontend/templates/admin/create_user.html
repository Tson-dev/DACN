{% extends "base.html" %}
{% block title %}Create User - Admin{% endblock %}
{% block body %}
<div class="navbar">
    <h1>Admin Panel</h1>
    <nav>
        <a href="/admin">Dashboard</a>
        <a href="/admin/users" class="active">Users</a>
        <a href="/admin/profiles">Profiles</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>
</div>
<div id="adminSection" data-action="createUser"></div>
<div class="page-container">
    <div class="card">
        <h2>Create New User</h2>
        <div id="createError" class="alert alert-error" style="display:none"></div>
        <form id="createUserForm" style="max-width:400px">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required minlength="3">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" required>
                    <option value="STUDENT">STUDENT</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Create</button>
                <a href="/admin/users" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/auth.js"></script>
<script src="/static/js/admin.js"></script>
{% endblock %}
